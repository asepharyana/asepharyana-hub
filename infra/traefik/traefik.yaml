api:
  dashboard: true
  insecure: true

log:
  level: INFO
  format: json

accessLog: {}

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'

providers:
  docker:
    endpoint: 'unix:///var/run/docker.sock'
    exposedByDefault: false
    network: app-shared-net
  file:
    directory: /etc/traefik/dynamic
    watch: true
