services:
  scraper-api:
    container_name: scraper-api
    image: ghcr.io/asepharyana/asepharyana-hub/scraper-api:sha-c4ecf8f
    restart: always
    networks:
      app-shared-net:
        aliases:
          - scraper-api
    env_file:
      - ../../.env
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4091/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DATABASE_URL=${DATABASE_URL}
      - EXTERNAL_BROWSERLESS_WS=ws://100.121.180.82:3001
networks:
  app-shared-net:
    name: app-shared-net
    external: true
