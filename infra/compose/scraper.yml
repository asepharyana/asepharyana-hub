services:
  scraper-api:
    container_name: scraper-api
    image: ghcr.io/asepharyana/asepharyana-hub/scraper-api:sha-73011d9
    restart: always
    depends_on:
      nats:
        condition: service_started
      dapr-placement:
        condition: service_started
    networks:
      app-shared-net:
        aliases:
          - scraper-api
    env_file:
      - ../../.env
    healthcheck:
      test: ['CMD-SHELL', 'curl -so /dev/null --connect-timeout 5 http://localhost:4091/ || test $? -eq 22']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DATABASE_URL=${DATABASE_URL}


  scraper-api-dapr:
    container_name: scraper-api-dapr
    image: daprio/daprd:latest
    restart: always
    depends_on:
      nats:
        condition: service_started
      dapr-placement:
        condition: service_started
    networks:
      - app-shared-net
    command:
      - './daprd'
      - '--app-id=scraper-api'
      - '--app-port=4091'
      - '--dapr-http-port=3500'
      - '--dapr-grpc-port=50001'
      - '--placement-host-address=dapr-placement:50005'
      - '--resources-path=/components'
    volumes:
      - ../../infra/dapr/components:/components

networks:
  app-shared-net:
    name: app-shared-net
    external: true
