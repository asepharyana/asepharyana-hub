services:
  redis:
    container_name: redis
    image: 'redis:alpine'
    restart: always
    networks:
      app-shared-net:
        aliases:
          - redis
    ports:
      - '${SHARED_REDIS_EXPOSE:-127.0.0.1:6379:6379}'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - 'redis_data:/data'

networks:
  app-shared-net:
    name: app-shared-net
    external: true

volumes:
  redis_data: null
