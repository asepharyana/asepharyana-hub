name: TypeCheck

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/react/src/**/*.ts'
      - 'apps/react/src/**/*.tsx'
      - 'apps/elysia/src/**/*.ts'
      - 'apps/elysia/tsconfig.json'
      - 'tsconfig.base.json'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: oven/setup-bun@v2
        with:
          bun-version: latest

      - name: TypeCheck apps/react
        working-directory: apps/react
        run: |
          bun install
          npx tsc --noEmit

      - name: TypeCheck apps/elysia
        working-directory: apps/elysia
        run: |
          bun install
          bun run check-types