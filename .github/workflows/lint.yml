name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/*/src/**/*.ts'
      - 'apps/*/src/**/*.tsx'
      - 'biome.json'
  push:
    branches: [main]
    paths:
      - 'apps/*/src/**/*.ts'
      - 'apps/*/src/**/*.tsx'
      - 'biome.json'

jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @biomejs/biome
      - run: biome ci . --no-errors-on-unmatched
